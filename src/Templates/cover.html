<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couverture Smartbook</title>
    <style>
        @font-face {
            font-family: 'Quicksand';
            src: url('{{FONT_REGULAR}}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Quicksand';
            src: url('{{FONT_BOLD}}') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
        }

        body {
            position: relative;
            background: white;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Bande verticale gauche avec dégradé */
        .left-gradient {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 100%;
            background: url('{{DEGRADE_IMAGE}}') no-repeat;
            background-size: 50px 100%;
            background-position: left top;
        }

        /* Zone de l'image de couverture */
        .cover-image-zone {
            position: absolute;
            right: 60px;
            top: 150px;
            width: 550px;
            height: 300px;
        }

        .cover-image-zone img {
            width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        /* Conteneur du texte */
        .text-container {
            position: absolute;
            left: 70px;
            right: 70px;
            top: 680px;
        }

        /* Titre */
        .title {
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            font-size: 42px;
            line-height: 1.2;
            color: rgb(30, 30, 30);
            text-align: left;
            word-wrap: break-word;
            text-transform: uppercase;
        }

        /* Sous-titre */
        .subtitle {
            font-family: 'Quicksand', sans-serif;
            font-weight: normal;
            font-size: 24px;
            line-height: 1.4;
            color: rgb(120, 120, 120);
            text-align: left;
            word-wrap: break-word;
            margin-top: 70px;
            text-transform: uppercase;
        }

        /* Ligne horizontale colorée */
        .category-line {
            position: absolute;
            left: 70px;
            bottom: 150px;
            right: 30px;
            height: 3px;
            background-color: {{CATEGORY_COLOR}};
        }

        /* Label de catégorie */
        .category-label {
            position: absolute;
            left: 70px;
            bottom: 100px;
            font-family: 'Quicksand', sans-serif;
            font-size: 20px;
            color: rgb(30, 30, 30);
        }

        /* Logo Smartbook */
        .smartbook-logo {
            position: absolute;
            right: 30px;
            bottom: 70px;
            width: 150px;
            height: 70px;
        }

        .smartbook-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Bande verticale gauche avec dégradé -->
    <div class="left-gradient"></div>

    <!-- Image de couverture -->
    <div class="cover-image-zone">
        <img src="{{COVER_IMAGE}}" alt="Image de couverture">
    </div>

    <!-- Titre et sous-titre -->
    <div class="text-container">
        <div class="title">{{TITLE}}</div>
        <div class="subtitle">{{SUBTITLE}}</div>
    </div>

    <!-- Ligne horizontale colorée -->
    <div class="category-line"></div>

    <!-- Label de catégorie -->
    <div class="category-label">{{CATEGORY_LABEL}}</div>

    <!-- Logo Smartbook -->
    <div class="smartbook-logo">
        <img src="{{LOGO_IMAGE}}" alt="Smartbook">
    </div>
</body>
</html>
