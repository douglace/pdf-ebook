<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentions Légales</title>
    <style>
        @font-face {
            font-family: 'Quicksand';
            src: url('{{FONT_REGULAR}}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
        }

        body {
            position: relative;
            background: white;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Bande verticale gauche avec dégradé */
        .left-gradient {
            position: absolute;
            left: 0;
            top: 0;
            width: 35px;
            height: 100%;
            background: url('{{DEGRADE_IMAGE}}') no-repeat;
            background-size: 35px 100%;
            background-position: left top;
        }

        /* Conteneur du texte de licence */
        .license-container {
            position: absolute;
            left: 70px;
            right: 70px;
            top: 420px;
        }

        .license-text {
            font-family: 'Quicksand', sans-serif;
            font-weight: normal;
            font-size: 10pt;
            line-height: 1.5;
            color: rgb(50, 50, 50);
            text-align: justify;
            margin-bottom: 10px;
        }

        /* Date de création */
        .creation-date {
            font-family: 'Quicksand', sans-serif;
            font-weight: normal;
            font-size: 10pt;
            color: rgb(50, 50, 50);
            text-align: center;
            margin-top: 20px;
        }

        /* Ligne horizontale */
        .separator-line {
            position: absolute;
            left: 90px;
            right: 90px;
            bottom: 97px;
            height: 3px;
            background-color: rgb(0, 0, 0);
        }

        /* Logo Smartbook */
        .smartbook-logo {
            position: absolute;
            right: 90px;
            bottom: 45px;
            width: 100px;
            height: 62px;
        }

        .smartbook-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* URL */
        .website-url {
            position: absolute;
            left: 90px;
            bottom: 60px;
            font-family: 'Quicksand', sans-serif;
            font-size: 12pt;
            color: rgb(30, 30, 30);
        }
    </style>
</head>
<body>
    <!-- Bande verticale gauche avec dégradé -->
    <div class="left-gradient"></div>

    <!-- Conteneur du texte de licence -->
    <div class="license-container">
        {{LICENSE_TEXT}}

        <div class="creation-date">
            {{CREATION_DATE}}
        </div>
    </div>

    <!-- Ligne horizontale -->
    <div class="separator-line"></div>

    <!-- URL -->
    <div class="website-url">www.encyclo-ai.com</div>

    <!-- Logo Smartbook -->
    <div class="smartbook-logo">
        <img src="{{LOGO_IMAGE}}" alt="Smartbook">
    </div>
</body>
</html>
